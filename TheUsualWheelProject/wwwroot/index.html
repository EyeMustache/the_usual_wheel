<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>TheUsualWheelProject</title>
    <base href="/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="TheUsualWheelProject.styles.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" href="data:,">
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">Loading...</div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    
    <script src="_framework/blazor.webview.js" autostart="false"></script>
    
    <!--Back button-->
    <script>
        window.blazorGoBack = function () {
            window.history.back();
        }
    </script>

    <!-- Blur input when keyboard closes so the modal centers itself -->
    <script>
        if (window.visualViewport) {
            let lastHeight = window.visualViewport.height;
            
            window.visualViewport.addEventListener('resize', () => {
                // If the visible screen suddenly gets taller by over 50px, the keyboard shrunk away
                if (window.visualViewport.height > lastHeight + 50) {
                    let active = document.activeElement;
                    // Forcefully unfocus the active input box so the CSS lets the modal drop
                    if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) {
                        active.blur(); 
                    }
                }
                lastHeight = window.visualViewport.height;
            });
        }
    </script>
</body>

</html>
